<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0E17; --bg2:#0c111d; --panel:#121826; --panel2:#161d2c;
    --line:#232c40; --line-soft:#1a2234;
    --ink:#EAF0F8; --muted:#94a2b8; --dim:#5f6c84;
    --red:#ED2A34; --red-br:#FF474D; --red-dp:#B00E14; --red-soft:rgba(237,42,52,.14);
    --cyan:#21C9F5; --cyan-br:#48E0FF; --cyan-dp:#0096D6; --cyan-soft:rgba(33,201,245,.13);
    --amber:#F3B33F; --amber-soft:rgba(243,179,63,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:'IBM Plex Sans Thai',system-ui,sans-serif;color:var(--ink);
    background:
      radial-gradient(880px 460px at 90% -10%, rgba(237,42,52,.14), transparent 60%),
      radial-gradient(820px 500px at 2% 112%, rgba(33,201,245,.13), transparent 58%),
      var(--bg);
    line-height:1.55;min-height:100vh;padding:38px 22px 58px;-webkit-font-smoothing:antialiased;
  }
  .num{font-family:'Space Grotesk',sans-serif;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  .wrap{max-width:1080px;margin:0 auto}

  /* masthead */
  .masthead{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
  .brandline{display:flex;align-items:center;gap:18px}
  .logo{height:56px;width:auto;display:block;filter:drop-shadow(0 6px 18px rgba(0,0,0,.4))}
  .vdiv{width:1px;height:44px;background:linear-gradient(180deg,transparent,var(--line),transparent)}
  .eyebrow{font-family:'Kanit',sans-serif;font-weight:600;font-size:10.5px;letter-spacing:2.5px;
    text-transform:uppercase;color:var(--cyan)}
  h1{font-family:'Kanit',sans-serif;font-weight:700;font-size:24px;color:#fff;line-height:1.12;margin-top:2px}
  h1 span{color:var(--red);}
  .docmeta{text-align:right;font-size:12.5px;color:var(--muted)}
  .docmeta .code{font-family:'Space Grotesk',sans-serif;font-weight:600;color:#fff;letter-spacing:1px}
  .docmeta .asof{display:inline-flex;align-items:center;gap:6px;margin-top:3px}
  .docmeta .asof::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 0 3px var(--cyan-soft)}
  .rule{height:2px;margin:17px 0 24px;border-radius:2px;
    background:linear-gradient(90deg,var(--red) 0%,var(--red-dp) 26%,#2a3350 50%,var(--cyan-dp) 74%,var(--cyan) 100%)}

  /* lede + gauge */
  .lede{display:grid;grid-template-columns:1.05fr .95fr;gap:26px;align-items:center;
    background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
    border-radius:20px;padding:24px 27px;box-shadow:0 24px 50px -34px rgba(0,0,0,.7);margin-bottom:15px}
  .lede h2{font-family:'Kanit',sans-serif;font-weight:600;font-size:14.5px;color:var(--cyan);margin-bottom:8px;letter-spacing:.3px}
  .lede p{font-size:14.5px;color:#cdd6e5}
  .lede p b{color:#fff}
  .lede .hi-r{color:var(--red-br);font-weight:600}
  .lede .hi-c{color:var(--cyan);font-weight:600}

  .gauge .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
  .gauge .pct{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:34px;color:#fff;line-height:1}
  .gauge .pct small{font-size:14px;color:var(--muted);font-weight:500;margin-left:5px}
  .gauge .cap{font-size:12px;color:var(--muted);text-align:right;max-width:150px}
  .track{height:22px;border-radius:11px;background:#0c1220;display:flex;overflow:hidden;border:1px solid var(--line);}
  .track div{height:100%}
  .fill-paid{background:linear-gradient(180deg,var(--cyan-br),var(--cyan-dp));box-shadow:0 0 20px rgba(33,201,245,.4) inset}
  .fill-wait{background:repeating-linear-gradient(45deg,#3a3a24,#3a3a24 7px,#45421f 7px,#45421f 14px)}
  .legend{display:flex;gap:18px;margin-top:11px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
  .legend span{display:inline-flex;align-items:center;gap:7px}
  .legend i{width:11px;height:11px;border-radius:3px;flex:none}
  .legend .i-paid{background:var(--cyan)} .legend .i-wait{background:var(--amber)}
  .legend b{color:#fff;font-family:'Space Grotesk',sans-serif}

  /* kpis */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:15px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:15px 16px;position:relative;overflow:hidden}
  .kpi .k{font-size:12px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:7px}
  .kpi .k::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--dim);flex:none}
  .kpi .v{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:24px;color:#fff;margin-top:7px;letter-spacing:-.5px}
  .kpi .u{font-size:11.5px;color:var(--dim);margin-top:3px}
  .kpi.k-paid .k::before{background:var(--cyan)} .kpi.k-paid .v{color:var(--cyan)}
  .kpi.k-wait .k::before{background:var(--amber)} .kpi.k-wait .v{color:var(--amber)}
  .kpi.k-spent .k::before{background:var(--red)} .kpi.k-spent .v{color:var(--red-br)}
  .kpi.k-barter .k::before{background:#a9b6cc}
  .kpi.net{grid-column:span 4;border-color:transparent;display:flex;align-items:center;justify-content:space-between;
    padding:19px 26px;background:
      linear-gradient(115deg, rgba(176,14,20,.9) 0%, rgba(237,42,52,.55) 26%, rgba(18,24,38,.2) 50%, rgba(0,150,214,.5) 74%, rgba(33,201,245,.85) 100%),
      var(--panel2)}
  .kpi.net::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;
    background:linear-gradient(180deg,var(--red),var(--cyan))}
  .kpi.net .k{color:#eaf0f8} .kpi.net .k::before{display:none}
  .kpi.net .k b{font-family:'Kanit',sans-serif;color:#fff;font-weight:600;font-size:15px;display:block;margin-bottom:2px}
  .kpi.net .v{color:#fff;font-size:31px;margin:0;text-shadow:0 2px 12px rgba(0,0,0,.5)}
  .kpi.net .v small{font-size:15px;color:#fff;opacity:.85;font-weight:500;margin-left:5px}

  /* split */
  .split{display:grid;grid-template-columns:1.62fr 1fr;gap:15px;align-items:start}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:17px;overflow:hidden}
  .panel .phead{display:flex;justify-content:space-between;align-items:center;padding:16px 19px 13px;border-bottom:1px solid var(--line)}
  .panel .phead h3{font-family:'Kanit',sans-serif;font-weight:600;font-size:15px;color:#fff}
  .panel .phead .meta{font-size:10.5px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;font-weight:500}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  thead th{font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:600;
    text-align:left;padding:11px 10px;background:#0e1420;border-bottom:1px solid var(--line)}
  thead th.r{text-align:right}
  tbody td{padding:11px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top}
  tbody tr:hover td{background:#141b2a}
  td.no{font-family:'Space Grotesk',sans-serif;color:var(--dim);font-weight:600;width:28px}
  td.r{text-align:right}
  td.cash{font-family:'Space Grotesk',sans-serif;font-weight:600;color:#fff;white-space:nowrap}
  td.barter{font-family:'Space Grotesk',sans-serif;color:var(--cyan);white-space:nowrap}
  td.barter .empty,td.cash .empty{color:#33405c;font-family:inherit}
  .spon{font-weight:600;color:var(--ink)}
  .spon .brand{display:inline-flex;align-items:center;gap:8px}
  .tag-new{font-family:'Kanit',sans-serif;font-size:9.5px;font-weight:600;letter-spacing:.5px;color:#fff;
    background:var(--red);border-radius:999px;padding:1px 8px}
  .proof{display:inline-block;margin-top:3px;font-size:11.5px;color:var(--cyan);text-decoration:none;font-weight:500}
  .proof:hover{text-decoration:underline}
  .note{display:block;margin-top:3px;font-size:11.5px;color:var(--amber)}
  .stat{display:flex;flex-direction:column;gap:5px;align-items:flex-start}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
  .pill::before{content:"";width:7px;height:7px;border-radius:50%}
  .pill.ok{color:var(--cyan);background:var(--cyan-soft)} .pill.ok::before{background:var(--cyan)}
  .pill.wait{color:var(--amber);background:var(--amber-soft)} .pill.wait::before{background:var(--amber)}
  .phase{font-size:11px;color:var(--muted)}
  tfoot td{padding:13px 10px;border-top:2px solid var(--cyan);font-weight:600;color:#fff;background:#0e1420}
  tfoot .lbl{font-family:'Kanit',sans-serif}
  tfoot td.cash,tfoot td.num{font-family:'Space Grotesk',sans-serif;font-weight:700}

  .exp-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 19px;border-bottom:1px solid var(--line-soft)}
  .exp-row .name{font-weight:600;color:var(--ink)}
  .exp-row .name small{display:block;font-weight:400;font-size:11.5px;color:var(--muted);margin-top:1px}
  .exp-row .amt{font-family:'Space Grotesk',sans-serif;font-weight:600;color:var(--red-br);white-space:nowrap}
  .exp-total{display:flex;justify-content:space-between;align-items:center;padding:13px 19px;background:var(--red-soft)}
  .exp-total .name{font-family:'Kanit',sans-serif;font-weight:600;color:var(--red-br)}
  .exp-total .amt{font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--red-br);font-size:16px}
  .stock{margin:15px 19px 19px;border:1px dashed var(--line);border-radius:13px;padding:15px;text-align:center;background:#0e1420}
  .stock .k{font-size:12px;color:var(--muted);font-weight:500}
  .stock .v{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:25px;color:#fff;margin:5px 0 2px}
  .stock .hint{font-size:11.5px;color:var(--dim)}

  footer{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
    margin-top:22px;padding-top:15px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
  footer a{color:var(--cyan);text-decoration:none;font-weight:500}
  footer a:hover{text-decoration:underline}

  .reveal{opacity:0;transform:translateY(10px);animation:rise .6s cubic-bezier(.2,.7,.2,1) forwards}
  .reveal:nth-child(2){animation-delay:.05s}.reveal:nth-child(3){animation-delay:.1s}
  .reveal:nth-child(4){animation-delay:.15s}.reveal:nth-child(5){animation-delay:.2s}
  @keyframes rise{to{opacity:1;transform:none}}

  @media (max-width:860px){
    .lede{grid-template-columns:1fr;gap:20px}
    .kpis{grid-template-columns:repeat(2,1fr)}
    .kpi.net{grid-column:span 2;flex-direction:column;align-items:flex-start;gap:6px}
    .split{grid-template-columns:1fr}
  }
  @media (max-width:480px){
    body{padding:24px 13px 40px}
    .kpis{grid-template-columns:1fr}.kpi.net{grid-column:span 1}
    h1{font-size:20px}.logo{height:46px}
  }
  @media (prefers-reduced-motion:reduce){.reveal{animation:none;opacity:1;transform:none}}

  .lockbg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}
  .lock-card{width:100%;max-width:430px;background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--line);border-radius:22px;box-shadow:0 30px 70px -30px rgba(0,0,0,.85);
    padding:34px 30px 26px;text-align:center;position:relative;overflow:hidden}
  .lock-card::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;
    background:linear-gradient(90deg,var(--red),#2a3350 50%,var(--cyan))}
  .lock-mark{height:82px;width:auto;margin:2px auto 14px;display:block;filter:drop-shadow(0 8px 22px rgba(0,0,0,.5))}
  .lock-eyebrow{font-family:'Kanit',sans-serif;font-size:10.5px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:var(--cyan)}
  .lock-card h1{font-family:'Kanit',sans-serif;font-size:19px;font-weight:700;color:#fff;margin:7px 0 4px}
  .lock-card h1 span{color:var(--red)}
  .lock-sub{font-size:13.5px;color:var(--muted);margin:0 0 22px;line-height:1.5}
  .lock-field{text-align:left}
  .lock-field label{font-size:12px;font-weight:600;color:var(--muted);display:block;margin:0 0 6px 2px}
  .lock-row{display:flex;gap:9px}
  #pw{flex:1;width:100%;font-family:inherit;font-size:16px;padding:13px 15px;border:1.6px solid var(--line);
    border-radius:13px;outline:none;background:#0c1220;color:var(--ink);transition:border-color .15s,box-shadow .15s;letter-spacing:.5px}
  #pw:focus{border-color:var(--cyan);box-shadow:0 0 0 4px var(--cyan-soft);background:#0e1626}
  .toggle{border:1.6px solid var(--line);background:#0c1220;border-radius:13px;padding:0 14px;cursor:pointer;font-size:17px;color:var(--muted)}
  .unlock{margin-top:16px;width:100%;font-family:'Kanit',sans-serif;font-size:15px;font-weight:600;color:#fff;
    border:0;border-radius:13px;padding:14px;cursor:pointer;letter-spacing:.3px;
    background:linear-gradient(110deg,var(--red-dp),var(--red) 45%,var(--cyan-dp) 55%,var(--cyan));
    background-size:200% 100%;background-position:0 0;transition:background-position .4s,transform .08s,filter .15s}
  .unlock:hover{background-position:100% 0} .unlock:active{transform:scale(.985)} .unlock:disabled{opacity:.7;cursor:progress}
  .err{min-height:18px;margin-top:12px;font-size:13px;font-weight:600;color:var(--red-br);opacity:0;transition:opacity .15s}
  .err.show{opacity:1}
  .shake{animation:shake .4s}
  @keyframes shake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}30%,50%,70%{transform:translateX(-5px)}40%,60%{transform:translateX(5px)}}
  .lock-foot{margin-top:18px;font-size:11.5px;color:#67748c;line-height:1.5}
  .lock-foot b{color:var(--cyan)}
</style>
</head>

  }catch(e){
    btn.disabled=false;btn.textContent="เปิดดูรายงาน";
    err.textContent="รหัสผ่านไม่ถูกต้อง ลองอีกครั้ง";err.classList.add("show");
    $("pw").value="";$("pw").focus();shake();
  }
}
function shake(){const c=$("lockcard");c.classList.remove("shake");void c.offsetWidth;c.classList.add("shake");}
$("unlock").addEventListener("click",unlock);
$("pw").addEventListener("keydown",e=>{if(e.key==="Enter")unlock();});
$("toggle").addEventListener("click",()=>{const p=$("pw");p.type=p.type==="password"?"text":"password";p.focus();});
</script>
